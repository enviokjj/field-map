<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>현장 지도 — 연구지역 · 도로(중심선)</title>
<!--
  현장 지도 — 지형분석 통합 서버의 구축 화면에서 **네 가지만** 떼어낸 독립 페이지.
    ① 연구지역 선택 (행정구역 4단계 · 수자원 단위지도 3종 — 면 클릭)
    ② 배경지도 선택 (일반 · 브이월드 · 위성)
    ③ 도로(중심선) — 벡터 타일(MVT)
    ④ GPS 현위치

  ★독립이다 — 원 저장소의 common.js·build.js 를 읽지 않는다. 이 파일 하나에 CSS·JS 가 다 있다.
  ★도로를 GeoJSON 으로 받지 않는다 — road_line 은 1,815만 건 7GB 라 화면 한 장이 z13 에서
    48.96MB(그나마 잘린 값)였다. MVT 로는 같은 화면이 85KB 다.
  ★GPS 는 **HTTPS 에서만 동작한다**(보안 컨텍스트). http:// 로 열면 브라우저가 위치를 아예
    안 준다 — localhost 만 예외. gpsStart() 가 그 경우를 먼저 알려 준다.

  설정은 아래 FIELD_CFG 한 곳에서만 바꾼다.
-->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--ink:#151D2C;--muted:#697A92;--line:#DEE4EC;--surface:#fff;--raise:#EEF2F6;
  --blue:#0B6FA4;--shadow:0 8px 28px rgba(21,29,44,.12),0 0 0 1px rgba(21,29,44,.07)}
*{box-sizing:border-box}
/* ★모바일 주소창이 접히고 펴지며 100vh 가 출렁인다 — dvh 를 쓰고, 지도는 fixed 로 고정한다.
   dvh 를 모르는 구형 브라우저용으로 100% 를 먼저 둔다(뒤 선언이 이긴다). */
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink)}
#map{position:fixed;inset:0}
.panel{position:absolute;background:rgba(255,255,255,.97);border-radius:10px;box-shadow:var(--shadow);z-index:5}
#ctl{top:12px;left:12px;padding:5px;display:flex;gap:2px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.panel button{border:none;background:none;color:var(--muted);font-size:12px;font-weight:500;padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.panel button:hover{background:var(--raise);color:var(--ink)}
#ctl button.on{background:var(--ink);color:#fff;font-weight:600}
.panel button.sep{margin-left:4px;border:1px solid var(--line)}
#status{pointer-events:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(21,29,44,.9);
  color:#fff;font-size:12px;padding:8px 14px;border-radius:8px;max-width:min(560px,calc(100vw - 24px));display:none;line-height:1.45}
#status.warn{background:#8a1c2b}
#coord{position:absolute;bottom:12px;right:12px;z-index:5;background:rgba(255,255,255,.92);border-radius:6px;
  padding:5px 9px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.maplibregl-ctrl-attrib{font-size:10px}
/* 노치·홈바를 피한다(viewport-fit=cover 와 짝) */
#ctl{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
#coord{bottom:calc(12px + env(safe-area-inset-bottom));right:calc(12px + env(safe-area-inset-right))}
#status{bottom:calc(12px + env(safe-area-inset-bottom))}
/* ★손가락 기준 — 마우스가 아니라 터치인 기기에서만 키운다(데스크톱 배치는 그대로).
   44px 은 손끝 접촉면 기준 권장 최소값이다. */
/* ★`pointer:coarse` 하나만 보면 안 된다 — 그 판정이 안 되는 기기가 있어(스타일러스 지원 등)
   폰인데도 큰 버튼이 안 떴다. **화면 폭 조건을 함께** 둔다. */
@media (pointer:coarse), (max-width:900px){
  .panel button{min-height:44px;font-size:14px;padding:10px 14px}
  #ctl{gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
       max-width:calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right))}
  #ctl::-webkit-scrollbar{display:none}
  #status{font-size:14px;padding:11px 16px}
}
/* 엄지로 누르는 현위치 버튼 — 화면 왼쪽 아래. **현위치는 이것 하나뿐이다.**
   ★상단 바에도 두고 화면 크기로 갈랐더니, 판정이 갈리는 기기마다 결과가 달랐다:
     처음엔 둘 다 사라졌고(pointer:coarse 미판정), 고친 뒤엔 바 버튼만 남아
     "왼쪽 아래로 안 갔다"가 됐다. 조건을 없애고 **항상 뜨는 하나**로 만든다. */
#gpsFab{display:flex;position:fixed;z-index:7;
  left:calc(14px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  align-items:center;justify-content:center;font-size:24px;
  background:rgba(255,255,255,.97);box-shadow:var(--shadow);color:var(--muted)}
#gpsFab.on{background:#1E88E5;color:#fff}
/* 메모 입력 — window.prompt 는 모바일 브라우저에 따라 막히거나 쓰기 나쁘다.
   화면 안에서 받는다(아래에서 올라오는 카드). */
#memoEdit{display:none;position:fixed;z-index:8;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 24px));padding:12px}
#memoEdit textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;font:inherit;font-size:14px;resize:vertical;min-height:64px}
#memoEdit .row{display:flex;gap:6px;margin-top:9px}
#memoEdit .row button{flex:1;padding:10px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
#memoEdit .row button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#memoEdit .row button.del{color:#B3261E;border-color:#F0C4C0}
/* 메모 버튼 아래로 펼쳐지는 선택 — 순환보다 무엇을 고르는지가 눈에 보인다 */
#memoMenu{display:none;position:absolute;z-index:9;padding:5px;flex-direction:column;gap:2px;min-width:132px}
#memoMenu button{width:100%;text-align:left}
#memoMenu button.on{background:var(--ink);color:#fff}
@media (max-width:700px){#coord{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="ctl">
  <button data-bm="osm">일반</button>
  <button data-bm="vworld">브이월드</button>
  <button data-bm="satellite">위성</button>
  <button data-bm="topo" id="btnTopo" style="display:none">지형</button>
  <button id="btnAoi" class="sep" style="display:none" title="연구지역으로 이동">⛶ 연구지역</button>
  <button id="btnRoad" title="도로 중심선 — 확대해야 보입니다">도로</button>
  <button id="btnMemo" class="sep" title="눌러서 점·선·면을 고릅니다. 메모는 이 기기에만 저장됩니다">✎ 메모</button>
  <button id="btnMemoOut" style="display:none" title="메모를 GeoJSON 파일로 내보내기">⤓</button>
</div>
<button id="gpsFab" title="현위치 — HTTPS 에서만 동작합니다" aria-label="현위치">◎</button>
<div class="panel" id="memoMenu">
  <button data-mm="point">● 점</button>
  <button data-mm="line">╱ 선</button>
  <button data-mm="polygon">▱ 사각형</button>
  <button data-mm="">■ 끄기</button>
</div>
<div class="panel" id="memoEdit">
  <textarea id="memoText" placeholder="이 지점에 남길 메모"></textarea>
  <div class="row">
    <button id="memoSave" class="pri">저장</button>
    <button id="memoDel" class="del">삭제</button>
    <button id="memoClose">닫기</button>
  </div>
</div>
<div id="status"></div>
<div id="coord">—</div>

<script>
/* ══ 설정 — 여기 한 곳만 고친다 ═══════════════════════════════════════════════
   apiBase        이 앱 서버 주소. ""(빈 문자열)=페이지와 같은 출처.
                  다른 시스템의 페이지에서 부를 때만 "https://…" 절대주소를 넣는다.
   hillshadeBase  '지형' 배경(5m DEM 음영기복)을 가진 원 게이트웨이 주소.
                  비워 두면 지형 버튼이 아예 안 뜬다(이 앱은 DEM 을 갖고 있지 않다).
   vworldKey      브이월드 인증키. ★키는 **접속 도메인에 묶인다** — 새 도메인에서 쓰려면
                  vworld.kr 에 그 도메인을 등록해야 타일이 온다.
   region         첫 화면에서 잡아 둘 연구지역.                                    */
const FIELD_CFG = {
  apiBase: "",
  hillshadeBase: "",
  vworldKey: "ABCD508D-277F-48D9-9589-C58D40472827",
  region: { layer:"adm_sigungu", code:"5181000000", name:"인제군",
            bbox:[127.9756, 37.8086, 128.5211, 38.3813] },
};
const AOI_COLOR = "#0A84FF";        // 연구지역 테두리 — 도로(마젠타)와 확실히 구분되게
const API = FIELD_CFG.apiBase.replace(/\/$/, "");
/* ★**절대 URL** 로 만든다.
   - `/tiles/…` 같은 루트 절대경로는 안 된다: GitHub Pages 프로젝트 저장소는 사이트가
     `https://<계정>.github.io/<저장소>/` 라 도메인 루트로 가서 404 다.
   - `./tiles/…` 같은 상대경로도 위험하다: **벡터 타일과 글리프는 워커에서 요청**되는데
     워커의 기준 URL 은 문서와 다를 수 있다(blob/스크립트 위치). 그러면 조용히 404 가 나고
     "도로가 안 보인다"로만 나타난다.
   그래서 페이지 주소를 기준으로 **직접 절대화**한다 — 루트 배포·하위경로 배포 모두 안전하다. */
/* ★`new URL(p, base)` 를 쓰면 안 된다 — URL 생성자가 타일 템플릿의 중괄호를
   퍼센트 인코딩한다: `{z}` → `%7Bz%7D`. 그러면 maplibre 가 치환을 못 해 없는 주소를 치고
   **도로가 통째로 사라진다**(2026-08-28 실제로 그렇게 됐다).
   그래서 '페이지가 있는 디렉터리'만 절대 주소로 구해 두고 **문자열로 붙인다**. */
const PAGE_DIR = document.baseURI.replace(/[^/]*$/, "").replace(/\/$/, "");
const api = (p) => (API || PAGE_DIR) + p;
const fetchJson = async (p) => {
  const r = await fetch(api(p));
  if(!r.ok) throw new Error(`${p} → ${r.status}`);
  return r.json();
};
function status(msg, warn){
  const el=document.getElementById("status");
  if(!msg){ el.style.display="none"; return; }
  el.textContent=msg; el.classList.toggle("warn", !!warn); el.style.display="block";
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.display="none"; }, warn?9000:4500);
}

/* ══ 배경지도 ════════════════════════════════════════════════════════════════
   ★위성 타일에는 글자가 하나도 없다 → 라벨 전용 타일(Hybrid)을 한 겹 얹는다.
     Hybrid 에는 도로 선이 같이 구워져 있어 뗄 수 없다(래스터 한 장이라 분리 불가).
   ★배경을 바꿀 때 라벨 층도 **같이** 지운다 — 안 지우면 다음 배경 위에 옛 라벨이 남는다. */
const vw = (layer, ext) =>
  `https://api.vworld.kr/req/wmts/1.0.0/${FIELD_CFG.vworldKey}/${layer}/{z}/{y}/{x}.${ext||"png"}`;
const BASEMAPS = {
  /* ★OSM 공개 타일 서버는 **쓰지 않는다**. 그쪽 사용정책이 앱 용도의 대량 사용을 금지하고,
     넘으면 차단한다 — 화면에 "Rate limit exceeded" 로 나타난다(실제로 겪었다).
     대신 V-World 의 밝은 지도(white)를 쓴다. 같은 사업자라 키·정책이 하나로 정리된다. */
  osm:       { tiles:[vw("white")], attribution:"© VWorld · 국토교통부" },
  vworld:    { tiles:[vw("Base")], attribution:"© VWorld · 국토교통부" },
  satellite: { tiles:[vw("Satellite","jpeg")], labelTiles:[vw("Hybrid")], attribution:"© VWorld · 국토교통부" },
};
if(FIELD_CFG.hillshadeBase){
  BASEMAPS.topo = { tiles:[FIELD_CFG.hillshadeBase.replace(/\/$/,"")+"/basemap/hillshade/{z}/{x}/{y}.png"],
                    attribution:"전국 5m DEM 음영기복 · NGII" };
  document.getElementById("btnTopo").style.display="";
}
let curBm = "vworld";

const map = new maplibregl.Map({
  container:"map",
  center:[(FIELD_CFG.region.bbox[0]+FIELD_CFG.region.bbox[2])/2,
          (FIELD_CFG.region.bbox[1]+FIELD_CFG.region.bbox[3])/2],
  zoom:11, maxPitch:0, attributionControl:{compact:true},
  // ★터치에서 두 손가락으로 실수로 회전시키면 북쪽이 어딘지 잃는다. 현장 지도라 고정한다.
  dragRotate:false, pitchWithRotate:false, touchPitch:false,
  style:{ version:8,
    // ★glyphs 는 반드시 **style 안**에. Map 옵션에 두면 maplibre 가 조용히 무시하고
    //   `glyphsUrl is not set` 이 난다 — 그러면 숫자가 섞인 라벨 하나 때문에 그 타일의
    //   심볼 전체가 실패해 한글 지명까지 통째로 사라진다(원 저장소에서 실제로 겪었다).
    glyphs: api("/fonts/{fontstack}/{range}.pbf"),
    sources:{ basemap:{type:"raster", tiles:BASEMAPS[curBm].tiles, tileSize:256, maxzoom:18,
                       attribution:BASEMAPS[curBm].attribution} },
    layers:[{id:"basemap", type:"raster", source:"basemap"}] }
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "bottom-right");
map.addControl(new maplibregl.ScaleControl({maxWidth:110, unit:"metric"}), "bottom-right");

function setBasemap(key){
  const b=BASEMAPS[key]; if(!b) return;
  curBm=key;
  ["basemap-lbl","basemap"].forEach(id=>{
    if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource(id)) map.removeSource(id);
  });
  const first=(map.getStyle().layers[0]||{}).id;      // 항상 맨 아래(도로·경계 밑)
  map.addSource("basemap",{type:"raster", tiles:b.tiles, tileSize:256, maxzoom:18, attribution:b.attribution});
  map.addLayer({id:"basemap", type:"raster", source:"basemap"}, first);
  if(b.labelTiles){
    map.addSource("basemap-lbl",{type:"raster", tiles:b.labelTiles, tileSize:256, maxzoom:18});
    map.addLayer({id:"basemap-lbl", type:"raster", source:"basemap-lbl"}, first);
  }
  document.querySelectorAll("#ctl [data-bm]").forEach(x=>x.classList.toggle("on", x.dataset.bm===key));
}
document.querySelectorAll("#ctl [data-bm]").forEach(b=>b.onclick=()=>setBasemap(b.dataset.bm));

/* ══ 도로(중심선) — 벡터 타일 ════════════════════════════════════════════════ */
/* 색은 여기 두 줄만 고치면 된다.
   ★마젠타를 고른 이유 — 배경 4종이 쓰지 않는 색이다. 브이월드·OSM 은 도로가 노랑/흰색,
     위성은 초록·회색, 지형은 베이지다. 빨강·주황 계열은 브이월드 도로와 섞여 안 보였다. */
const ROAD_COLOR  = "#FF2D95";      // 도로 중심선
/* 테두리는 **어둡게**. 흰 테두리는 브이월드·일반(밝은 베이지·흰색) 위에서 같이 밝아
   경계가 사라졌다. 어두운 테두리는 밝은 배경에서 선을 떼어 주고, 어두운 위성에서는
   마젠타 자체가 충분히 밝아 문제가 없다. */
const ROAD_CASING = "#1A1030";      // 테두리
let ROAD_MINZ = 12;                 // /tiles/layers 에서 덮어쓴다(사본을 여기 고정하지 않는다)
let roadOn = false;
function roadLayers(){
  return [
    {id:"road-case", type:"line", source:"road", "source-layer":"road_line", minzoom:ROAD_MINZ,
     paint:{"line-color":ROAD_CASING,"line-opacity":0.5,
            "line-width":["interpolate",["linear"],["zoom"],12,4.2,17,9.5,22,15.0]}},
    {id:"road-line", type:"line", source:"road", "source-layer":"road_line", minzoom:ROAD_MINZ,
     layout:{"line-cap":"round","line-join":"round"},
     paint:{"line-color":ROAD_COLOR,"line-opacity":1.0,
            "line-width":["interpolate",["linear"],["zoom"],12,2.0,17,5.5,22,9.0]}},
    {id:"road-name", type:"symbol", source:"road", "source-layer":"road_line", minzoom:14,
     filter:["all",["has","name"],["!=",["get","name"],""]],
     layout:{"symbol-placement":"line","text-field":["get","name"],
             "text-font":["Noto Sans Regular"],"text-size":11,"symbol-spacing":180},
     paint:{"text-color":"#8E0A47","text-halo-color":"#FFFFFF","text-halo-width":1.8}},
  ];
}
/* 도로 버튼 하나가 **표시와 투명도**를 같이 돈다: 100% → 70% → 40% → 끔 → …
   ★버튼을 더 늘리지 않으려고 합쳤다. 현장에서 도로가 영상을 가릴 때 한 번 더 누르면 옅어진다.
   ★테두리는 선보다 더 옅게 간다 — 투명해질수록 흰/검은 테두리가 먼저 눈에 거슬린다. */
const ROAD_STEPS = [1.0, 0.7, 0.4, 0];      // 0 = 끔
let roadStep = 0;
function roadApply(){
  const op = ROAD_STEPS[roadStep];
  const btn=document.getElementById("btnRoad");
  if(op === 0){
    roadLayers().forEach(L=>{ if(map.getLayer(L.id)) map.removeLayer(L.id); });
    if(map.getSource("road")) map.removeSource("road");
    roadOn=false; btn.classList.remove("on"); btn.textContent="도로";
    return;
  }
  if(!map.getSource("road"))
    // maxzoom:18 = 10m 축척(z19~20)까지 실제 데이터로 버틴다. 그 위는 18 타일을 확대해 쓴다.
    //   ★확대해 써도 손실은 없다 — MVT 는 타일당 4096 격자라 z18 이면 이미 0.15m 급이다.
    //     굽는 줌을 더 올리는 건 파일 수만 4배씩 늘릴 뿐이다.
    map.addSource("road",{type:"vector", tiles:[api("/tiles/road_line/{z}/{x}/{y}.pbf")],
                          minzoom:ROAD_MINZ, maxzoom:18});
  roadLayers().forEach(L=>{ if(!map.getLayer(L.id)) map.addLayer(L); });
  roadOn=true; btn.classList.add("on"); btn.textContent="도로";   // ★%는 버튼에 안 쓴다(요청) — 바꿀 때 안내만
  if(map.getLayer("road-line")) map.setPaintProperty("road-line","line-opacity", op);
  if(map.getLayer("road-case")) map.setPaintProperty("road-case","line-opacity", op*0.5);
  if(map.getLayer("road-name")) map.setPaintProperty("road-name","text-opacity", op);
}
function roadToggle(){
  roadStep = (roadStep + 1) % ROAD_STEPS.length;
  roadApply();
  const op = ROAD_STEPS[roadStep];
  status(op === 0 ? "도로를 껐습니다"
    : (map.getZoom() < ROAD_MINZ
        ? `도로 ${Math.round(op*100)}% — 🔍 z${ROAD_MINZ} 이상으로 확대해야 보입니다`
        : `도로 ${Math.round(op*100)}%`));
}
document.getElementById("btnRoad").onclick=roadToggle;
{ const b=document.getElementById("btnAoi"); if(b) b.onclick=aoiGo; }

/* ══ 연구지역(AOI) — 서버에 등록된 것을 그대로 보여준다 ═════════════════════
   ★'연구지역 선택'(시도/시군구/읍면동/리·유역 클릭) 도구는 뺐다. 이 화면의 목적은
     **이미 정해진 연구지역**을 현장에서 확인하는 것이라, 고르는 기능이 필요 없다.
   AOI 는 catalog.asset(kind='aoi_cube') 의 footprint — 구축 시 잡힌 사각 범위다. */
let aoiBounds=null;
function aoiGo(){                            // 아이콘 → 연구지역으로 이동(텍스트 표시는 안 한다)
  if(!aoiBounds){ status("연구지역을 아직 못 받았습니다", true); return; }
  const [w,s2,e,n]=aoiBounds;
  map.fitBounds([[w,s2],[e,n]],{padding:56});
}
async function aoiLoad(){
  let gj;
  try{ gj = await fetchJson("/aoi/items"); }
  catch(e){ status("연구지역을 못 받았습니다: "+e, true); return null; }
  const feats = gj.features||[];
  if(!feats.length){ status("등록된 연구지역이 없습니다", true); return null; }
  map.addSource("aoi",{type:"geojson", data:gj});
  map.addLayer({id:"aoi-fill", type:"fill", source:"aoi",
    paint:{"fill-color":AOI_COLOR,"fill-opacity":0.06}});
  map.addLayer({id:"aoi-line", type:"line", source:"aoi",
    paint:{"line-color":AOI_COLOR,"line-width":["interpolate",["linear"],["zoom"],9,1.6,15,3.2],
           "line-dasharray":[3,2]}});
  /* ★이름 라벨은 그리지 않는다. 폴리곤에 symbol 을 얹으면 확대할수록 **타일마다 한 번씩**
     찍혀 같은 이름이 여러 개로 보인다(면이 여러 타일에 걸치기 때문). 대신 버튼으로 옮긴다. */
  // 화면을 연구지역에 맞춘다 — 이 앱이 보여줄 대상이 그것이다
  let w=180,s2=90,e=-180,n=-90;
  feats.forEach(f=>{ (function walk(c){
    if(typeof c[0]==="number"){ w=Math.min(w,c[0]); e=Math.max(e,c[0]); s2=Math.min(s2,c[1]); n=Math.max(n,c[1]); return; }
    c.forEach(walk); })(f.geometry.coordinates); });
  map.fitBounds([[w,s2],[e,n]],{padding:56, duration:0});
  const p0=feats[0].properties;
  aoiBounds=[w,s2,e,n];
  const b=document.getElementById("btnAoi");
  if(b){ b.style.display=""; b.title=`연구지역으로 이동 — ${p0.name}` + (p0.km2?` (${p0.km2} km²)`:""); }
  return aoiBounds;                         // 리를 이 범위로 받는다(아래)
}

/* ══ 리(법정리) — 항상 표시 ═════════════════════════════════════════════════
   현장에서 위치를 말할 때 쓰는 최소 단위라 **토글 없이 상시**로 둔다.
   ★라벨은 서버가 준 대표점(properties.lon/lat)에 찍는다 — 폴리곤에 symbol 을 얹으면
     MultiPolygon 파트마다 앵커가 생겨 섬·분리된 조각마다 같은 지명이 반복된다.
     그 대표점은 **최대 파트의 ST_PointOnSurface** 다(중심점이 아니다 — 도넛이면 구멍에 떨어진다).
   ★z11 미만에서는 감춘다. 인제 한 곳만 해도 235개라 더 넓게 보면 서로 겹쳐 못 읽는다. */
const RI_MINZ = 11;
async function riLoad(bounds){
  // ★bbox 를 반드시 실어 보낸다. 서버 모드에서는 리가 전국 15,161건이라 bbox 가 없으면
  //   **413 으로 막힌다**(조용히 자르지 않는 설계다). 정적 모드에서는 쿼리가 무시되고
  //   미리 잘라 둔 파일이 오므로 양쪽에서 같은 코드가 그대로 돈다.
  let q="";
  if(bounds){
    const [w,s2,e,n]=bounds, dx=(e-w)*0.25, dy=(n-s2)*0.25;
    q=`?bbox=${[w-dx,s2-dy,e+dx,n+dy].map(v=>v.toFixed(5)).join(",")}`;
  }
  let gj;
  try{ gj = await fetchJson(`/boundary/adm_ri/items${q}`); }
  catch(e){ console.warn("[리] 불러오기 실패", e); return; }
  const feats = gj.features||[];
  map.addSource("ri",{type:"geojson", data:gj});
  map.addSource("ri-lbl",{type:"geojson", data:{type:"FeatureCollection", features:feats
    .filter(f=>typeof f.properties.lon==="number" && typeof f.properties.lat==="number")
    .map(f=>({type:"Feature", properties:f.properties,
              geometry:{type:"Point", coordinates:[f.properties.lon,f.properties.lat]}}))}});
  map.addLayer({id:"ri-line", type:"line", source:"ri", minzoom:RI_MINZ,
    paint:{"line-color":"#3B4A5A","line-opacity":0.45,"line-dasharray":[2,3],
           "line-width":["interpolate",["linear"],["zoom"],11,0.6,16,1.2]}});
  map.addLayer({id:"ri-label", type:"symbol", source:"ri-lbl", minzoom:RI_MINZ,
    layout:{"text-field":["get","name"],"text-font":["Noto Sans Regular"],"text-padding":3,
            "text-size":["interpolate",["linear"],["zoom"],11,10.5,16,13],
            "symbol-sort-key":["-",0,["coalesce",["get","area_km2"],0]]},
    paint:{"text-color":"#22303F","text-halo-color":"#FFFFFF","text-halo-width":1.9}});
  console.log(`[리] ${feats.length}건`);
}

/* ══ 메모 — 점·선·면을 그리고 글을 남긴다 ══════════════════════════════════
   ★서버가 없다(정적 배포). 메모는 **이 기기 이 브라우저**에만 남는다(localStorage).
     기기를 바꾸거나 저장소를 지우면 사라진다 — 숨기지 않는다.
     나누려면 ⤓ 로 GeoJSON 을 내보낸다(QGIS·다른 지도에서 바로 열린다).
   ★라벨은 도형 위에 직접 얹지 않고 **대표점 하나**를 따로 만들어 찍는다.
     폴리곤/라인에 symbol 을 얹으면 도형이 여러 타일에 걸칠 때 타일마다 한 번씩 찍혀
     같은 글이 여러 개로 보인다(연구지역 이름에서 실제로 겪었다). */
const MEMO_KEY = "fieldmap.memos.v1";
const MEMO_MODES = [null, "point", "line", "polygon"];
const MEMO_LABEL = {null:"✎ 메모", point:"✎ 점", line:"✎ 선", polygon:"✎ 사각형"};
let memoModeIdx = 0, drawPts = [];
const memoMode = () => MEMO_MODES[memoModeIdx];

function memoRead(){
  try{ const v=JSON.parse(localStorage.getItem(MEMO_KEY));
       if(v && v.type==="FeatureCollection" && Array.isArray(v.features)) return v; }
  catch(e){ console.warn("[메모] 읽기 실패", e); }
  return {type:"FeatureCollection", features:[]};
}
function memoWrite(fc){
  // ★쓰고 나서 **되읽어 확인**한다. 사파리 비공개 모드·저장소 가득참 등에서 setItem 이
  //   조용히 실패하거나 예외 없이 안 남는 경우가 있어, 그러면 "저장을 눌러도 저장이 안 된다"가 된다.
  try{
    localStorage.setItem(MEMO_KEY, JSON.stringify(fc));
    const back=JSON.parse(localStorage.getItem(MEMO_KEY)||"null");
    if(!back || back.features.length!==fc.features.length) throw new Error("되읽기 불일치");
    return true;
  }catch(e){
    console.warn("[메모] 저장 실패", e);
    status("메모를 저장하지 못했습니다 — 브라우저 저장소가 막혀 있습니다(비공개 모드?). "
         + "⤓ 로 내보내 두세요.", true);
    return false;
  }
}
/* 도형 하나의 **대표점** — 라벨을 여기 한 번만 찍는다. */
function memoAnchor(g){
  if(g.type==="Point") return g.coordinates;
  if(g.type==="LineString") return g.coordinates[Math.floor(g.coordinates.length/2)];
  if(g.type==="Polygon"){
    const r=g.coordinates[0].slice(0,-1);        // 닫는 점 제외
    return [r.reduce((a,c)=>a+c[0],0)/r.length, r.reduce((a,c)=>a+c[1],0)/r.length];
  }
  return null;
}
function memoRender(){
  const fc=memoRead();
  const s1=map.getSource("memo"); if(s1) s1.setData(fc);
  const s2=map.getSource("memo-lbl");
  if(s2) s2.setData({type:"FeatureCollection", features: fc.features
    .map(f=>{ const a=memoAnchor(f.geometry); return a &&
      {type:"Feature", properties:f.properties, geometry:{type:"Point", coordinates:a}}; })
    .filter(Boolean)});
  const b=document.getElementById("btnMemo");
  if(b){
    const n=fc.features.length, m=memoMode();
    b.textContent = m ? (drawPts.length ? `${MEMO_LABEL[m]} ${drawPts.length}` : MEMO_LABEL[m])
                      : (n ? `✎ 메모 ${n}` : "✎ 메모");   // 끔이면 저장된 개수를 보여 준다
    b.classList.toggle("on", !!m);
  }
  const out=document.getElementById("btnMemoOut");
  if(out) out.style.display = fc.features.length ? "" : "none";
}
function draftRender(){
  const src=map.getSource("draft"); if(!src) return;
  // 두 점이면 바로 완성되므로 미리보기는 **첫 점 하나**뿐이다
  src.setData({type:"FeatureCollection",
    features: drawPts.map(c=>({type:"Feature",properties:{},
                               geometry:{type:"Point",coordinates:c}}))});
  memoRender();
}
function memoLayers(){
  if(map.getSource("memo")) return;
  map.addSource("memo",{type:"geojson", data:memoRead()});
  map.addSource("memo-lbl",{type:"geojson", data:{type:"FeatureCollection",features:[]}});
  map.addSource("draft",{type:"geojson", data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"memo-fill", type:"fill", source:"memo",
    filter:["==",["geometry-type"],"Polygon"],
    paint:{"fill-color":"#FFB300","fill-opacity":0.16}});
  map.addLayer({id:"memo-line", type:"line", source:"memo",
    filter:["in",["geometry-type"],["literal",["LineString","Polygon"]]],
    paint:{"line-color":"#FF8F00","line-width":2.6}});
  map.addLayer({id:"memo-dot", type:"circle", source:"memo",
    filter:["==",["geometry-type"],"Point"],
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],11,5,17,9],
           "circle-color":"#FFB300","circle-stroke-color":"#3E2723","circle-stroke-width":2}});
  map.addLayer({id:"memo-label", type:"symbol", source:"memo-lbl", minzoom:12,
    layout:{"text-field":["get","text"],"text-font":["Noto Sans Regular"],
            "text-size":12,"text-anchor":"top","text-offset":[0,0.9],"text-max-width":11},
    paint:{"text-color":"#3E2723","text-halo-color":"#FFFFFF","text-halo-width":2.0}});
  map.addLayer({id:"draft-line", type:"line", source:"draft",
    paint:{"line-color":"#00B0FF","line-width":2.4,"line-dasharray":[2,2]}});
  map.addLayer({id:"draft-fill", type:"fill", source:"draft",
    filter:["==",["geometry-type"],"Polygon"],
    paint:{"fill-color":"#00B0FF","fill-opacity":0.18}});
  map.addLayer({id:"draft-dot", type:"circle", source:"draft",
    paint:{"circle-radius":5,"circle-color":"#00B0FF","circle-stroke-color":"#fff","circle-stroke-width":2}});
}
function memoMenuToggle(){
  const menu=document.getElementById("memoMenu"), btn=document.getElementById("btnMemo");
  const open = menu.style.display !== "flex";
  if(open){                                   // 버튼 바로 아래에 붙인다
    const r=btn.getBoundingClientRect();
    menu.style.left = `${Math.max(8, r.left)}px`;
    menu.style.top  = `${r.bottom + 6}px`;
    menu.style.display = "flex";
  } else menu.style.display = "none";
  menu.querySelectorAll("[data-mm]").forEach(b=>
    b.classList.toggle("on", (b.dataset.mm||"") === (memoMode()||"")));
}
function memoPick(mode){
  document.getElementById("memoMenu").style.display="none";
  if(drawPts.length) status("그리던 도형을 버렸습니다");
  drawPts=[]; draftRender();
  memoModeIdx = MEMO_MODES.indexOf(mode || null);
  if(memoModeIdx < 0) memoModeIdx = 0;
  const m=memoMode();
  map.getCanvas().style.cursor = m ? "crosshair" : "";
  // 사각형을 끌어 그리는 동안 지도가 같이 밀리면 안 된다
  if(m==="polygon") map.dragPan.disable(); else map.dragPan.enable();
  rectStart=null; rectPreview(null,null);
  status(m==="point"   ? "지점을 누르면 메모를 남깁니다"
       : m==="line"    ? "선 — 시작점과 끝점, 두 곳을 누르세요"
       : m==="polygon" ? "사각형 — 지도를 끌어서 그리세요"
       : "메모 그리기를 껐습니다");
  memoRender();
}
/* ── 메모 입력 카드 ─────────────────────────────────────────────────────────
   ★window.prompt 를 쓰지 않는다. 모바일 브라우저에 따라 막히거나(무반응) 화면을 가려서
     "점은 찍히는데 메모를 못 남긴다" 가 된다. 화면 안에서 받는다. */
let memoEditId = null;
function memoOpen(id){
  const f = memoRead().features.find(x=>x.properties.id===id);
  if(!f) return;
  memoEditId = id;
  const ta=document.getElementById("memoText");
  ta.value = f.properties.text || "";
  document.getElementById("memoEdit").style.display="block";
  setTimeout(()=>ta.focus(), 50);
}
function memoClose(){
  memoEditId=null;
  document.getElementById("memoEdit").style.display="none";
}
function memoSaveEdit(){
  if(!memoEditId) return memoClose();
  const fc=memoRead(), f=fc.features.find(x=>x.properties.id===memoEditId);
  if(f) f.properties.text = document.getElementById("memoText").value.trim();
  if(memoWrite(fc)){ memoRender(); memoClose(); status("메모를 저장했습니다"); }
}
function memoDelete(){
  if(!memoEditId) return memoClose();
  const fc=memoRead();
  fc.features = fc.features.filter(x=>x.properties.id!==memoEditId);
  if(memoWrite(fc)){ memoRender(); memoClose(); status("메모를 지웠습니다"); }
}
/* 도형을 저장소에 넣고 바로 편집 카드를 연다 — 도형은 **누르는 즉시** 지도에 남고,
   글은 그다음에 적는다(안 적어도 도형은 남는다). */
function memoAdd(geom){
  const id=`m${Date.now()}${Math.floor(Math.random()*1000)}`;
  const fc=memoRead();
  fc.features.push({type:"Feature", geometry:geom,
    properties:{ id, text:"", at:new Date().toISOString() }});
  if(!memoWrite(fc)) return null;
  memoRender(); memoOpen(id);
  return id;
}

/* ★선·면은 **두 점**으로 끝난다.
     - 선: 시작점 → 끝점
     - 면: 대각 모서리 두 곳 → **사각형**
   종전엔 점을 여러 개 찍고 ✓ 로 마치게 했는데, 찍는 동안 점만 보여
   "그냥 점으로만 찍힌다"가 됐다. 두 점이면 누구나 예측할 수 있고 모바일에서도 쉽다.
   (꺾인 선·자유 다각형이 필요해지면 그때 ✓ 방식을 되살린다) */
function rectFrom(a, b){                    // 대각 두 점 → 사각형 링(닫힌 고리)
  const x1=Math.min(a[0],b[0]), x2=Math.max(a[0],b[0]);
  const y1=Math.min(a[1],b[1]), y2=Math.max(a[1],b[1]);
  return [[[x1,y1],[x2,y1],[x2,y2],[x1,y2],[x1,y1]]];
}
function memoFinishTwoPoint(){
  const m=memoMode();
  if(drawPts.length < 2) return false;
  const [a,b]=drawPts;
  // 같은 자리를 두 번 누른 경우 — 도형이 안 된다
  if(Math.abs(a[0]-b[0])<1e-7 && Math.abs(a[1]-b[1])<1e-7){
    drawPts=[]; draftRender(); status("두 점이 같은 자리입니다 — 다시 찍어 주세요", true); return true;
  }
  const geom = (m==="line") ? {type:"LineString", coordinates:[a,b]}
                            : {type:"Polygon", coordinates:rectFrom(a,b)};
  drawPts=[]; draftRender();
  memoAdd(geom);                            // 도형을 먼저 남기고, 글은 카드에서 적는다
  status(m==="line" ? "선을 그렸습니다 — 메모를 적으세요" : "사각형을 그렸습니다 — 메모를 적으세요");
  return true;
}
/* ── 사각형은 **드래그**로 그린다 ───────────────────────────────────────────
   ★두 번 눌러 만들게 했더니 "사각형을 그리는 모양이 아니다"는 지적을 받았다.
     끌어서 크기를 보며 그리는 게 사람이 기대하는 동작이다.
   ★끄는 동안 지도가 같이 밀리면 안 되므로 dragPan 을 잠근다(모드에서 나가면 되돌린다).
   ★마우스와 터치를 같이 받는다 — 폰이 주 사용처다. */
let rectStart=null;
function rectPreview(a,b){
  const src=map.getSource("draft"); if(!src) return;
  src.setData({type:"FeatureCollection", features: (a&&b)
    ? [{type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:rectFrom(a,b)}}] : []});
}
function rectPt(ev){
  const t=(ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;
  const r=map.getCanvas().getBoundingClientRect();
  const ll=map.unproject([t.clientX-r.left, t.clientY-r.top]);
  return [+ll.lng.toFixed(6), +ll.lat.toFixed(6)];
}
function rectDown(ev){
  if(memoMode()!=="polygon") return;
  ev.preventDefault();
  rectStart=rectPt(ev); rectPreview(null,null);
  status("끌어서 크기를 정하고 손을 떼세요");
}
function rectMove(ev){
  if(memoMode()!=="polygon" || !rectStart) return;
  ev.preventDefault();
  rectPreview(rectStart, rectPt(ev));
}
function rectUp(ev){
  if(memoMode()!=="polygon" || !rectStart) return;
  const a=rectStart, b=rectPt(ev);
  rectStart=null; rectPreview(null,null);
  if(Math.abs(a[0]-b[0])<1e-6 && Math.abs(a[1]-b[1])<1e-6){
    status("끌어서 사각형 크기를 정해 주세요", true); return;
  }
  memoAdd({type:"Polygon", coordinates:rectFrom(a,b)});
  status("사각형을 그렸습니다 — 메모를 적으세요");
}
function rectBind(){
  const c=map.getCanvasContainer();
  c.addEventListener("mousedown", rectDown);
  c.addEventListener("mousemove", rectMove);
  window.addEventListener("mouseup", rectUp);
  c.addEventListener("touchstart", rectDown, {passive:false});
  c.addEventListener("touchmove",  rectMove, {passive:false});
  c.addEventListener("touchend",   rectUp,   {passive:false});
}
async function memoExport(){
  const fc=memoRead();
  if(!fc.features.length){ status("내보낼 메모가 없습니다", true); return; }
  const text=JSON.stringify(fc,null,2);
  const name=`memos_${new Date().toISOString().slice(0,10)}.geojson`;

  /* ★아이폰(사파리)은 `<a download>` 로 파일을 못 받는다 — 눌러도 아무 일이 없다.
     iOS 에서 파일을 빼내는 정상 경로는 **공유 시트**다. 그래서 순서를 이렇게 둔다:
       ① 공유 시트(navigator.share files) — iOS·안드로이드
       ② 다운로드(a[download])          — 데스크톱
       ③ 클립보드 복사                   — 둘 다 막혔을 때
     ★공유는 **사용자 제스처 안에서** 불러야 한다 — 앞에서 await 하지 않는다. */
  try{
    if(navigator.canShare && typeof File==="function"){
      const file=new File([text], name, {type:"application/geo+json"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"현장 메모"});
        status(`메모 ${fc.features.length}건을 공유했습니다`);
        return;
      }
    }
  }catch(e){
    if(e && e.name==="AbortError") return;      // 사용자가 공유를 닫았다 — 실패가 아니다
    console.warn("[내보내기] 공유 실패", e);
  }
  try{
    const blob=new Blob([text],{type:"application/geo+json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    status(`메모 ${fc.features.length}건을 내려받았습니다`);
    return;
  }catch(e){ console.warn("[내보내기] 다운로드 실패", e); }
  try{
    await navigator.clipboard.writeText(text);
    status(`메모 ${fc.features.length}건을 클립보드에 복사했습니다 — 메모장에 붙여 넣어 보관하세요`);
  }catch(e){
    status("내보내기가 막혀 있습니다 — 브라우저에서 공유·다운로드·클립보드가 모두 차단됐습니다", true);
  }
}

map.on("click",(e)=>{
  const m=memoMode();
  // 그리는 중이 아닐 때만 기존 메모를 집는다 — 그리는 중에 눌리면 점이 안 찍힌다
  if(!m){
    const ids=["memo-dot","memo-line","memo-fill"].filter(l=>map.getLayer(l));
    const hit=ids.length ? map.queryRenderedFeatures(e.point,{layers:ids}) : [];
    if(!hit.length) return;
    const fc=memoRead(), id=hit[0].properties.id;
    const cur=fc.features.find(f=>f.properties.id===id);   // eslint-disable-line
    if(cur) memoOpen(id);                   // 카드에서 고치거나 지운다
    return;
  }
  const c=[+e.lngLat.lng.toFixed(6), +e.lngLat.lat.toFixed(6)];
  if(m==="point"){
    // ★누르는 즉시 점이 지도에 찍힌다. 글은 카드에서 적는다(안 적어도 점은 남는다).
    memoAdd({type:"Point", coordinates:c});
    status(`점을 찍었습니다 (${c[1].toFixed(5)}, ${c[0].toFixed(5)}) — 메모를 적으세요`);
    return;
  }
  if(m==="polygon") return;                // 사각형은 드래그로 그린다(아래 핸들러)
  drawPts.push(c);
  if(!memoFinishTwoPoint()){               // 두 점이 되면 바로 선이 된다
    draftRender();
    status("끝점을 누르세요");
  }
});

/* ══ GPS 현위치 ══════════════════════════════════════════════════════════════
   ★HTTPS(보안 컨텍스트)에서만 동작한다. http:// 로 열면 브라우저가 위치를 아예 안 준다
     (localhost 만 예외). 그 경우를 먼저 알려 준다 — 안 그러면 "눌러도 아무 일도 없다"가 된다. */
let gpsWatch=null, gpsFollow=false;
// 바 버튼과 엄지 버튼(FAB) 두 개가 같은 상태를 보여야 한다 — 한쪽만 바꾸면 어긋난다
const gpsBtns = () => [document.getElementById("btnGps"), document.getElementById("gpsFab")].filter(Boolean);
const gpsMark = (on) => gpsBtns().forEach(b=>b.classList.toggle("on", on));
function gpsLayers(){
  if(map.getSource("gps")) return;
  map.addSource("gps",{type:"geojson", data:{type:"FeatureCollection",features:[]}});
  // 정확도 원 — 반경(m)을 화면 픽셀로 환산(위도 보정 포함). 줌에 따라 실제 크기를 유지한다.
  map.addLayer({id:"gps-acc", type:"circle", source:"gps",
    paint:{"circle-color":"#1E88E5","circle-opacity":0.13,
           "circle-stroke-color":"#1E88E5","circle-stroke-opacity":0.35,"circle-stroke-width":1,
           "circle-radius":["interpolate",["exponential",2],["zoom"],
              0,0, 22,["/",["*",["get","acc"],4194304],["*",156543.03,["get","cosLat"]]]]}});
  map.addLayer({id:"gps-dot", type:"circle", source:"gps",
    paint:{"circle-radius":6,"circle-color":"#1E88E5","circle-stroke-color":"#fff","circle-stroke-width":2.5}});
}
function gpsStop(){
  if(gpsWatch!==null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; }
  gpsFollow=false;
  ["gps-dot","gps-acc"].forEach(id=>{ if(map.getLayer(id)) map.removeLayer(id); });
  if(map.getSource("gps")) map.removeSource("gps");
  gpsMark(false);
}
function gpsStart(){
  if(gpsWatch!==null){ gpsStop(); status("현위치를 껐습니다"); return; }
  if(!navigator.geolocation){ status("이 브라우저는 위치 기능을 지원하지 않습니다", true); return; }
  if(!window.isSecureContext){          // ★여기서 안 막으면 "눌러도 반응이 없다"가 된다
    status("현위치는 HTTPS 에서만 동작합니다. 지금은 " + location.protocol
      + " 로 열려 있어 브라우저가 위치를 주지 않습니다 (localhost 만 예외).", true);
    return;
  }
  gpsLayers(); gpsMark(true); gpsFollow=true;
  status("현위치를 찾는 중…");
  gpsWatch = navigator.geolocation.watchPosition((pos)=>{
    const {latitude:lat, longitude:lon, accuracy:acc} = pos.coords;
    const src=map.getSource("gps"); if(!src) return;
    src.setData({type:"FeatureCollection", features:[{type:"Feature",
      properties:{acc:Math.max(acc||0,1), cosLat:Math.cos(lat*Math.PI/180)},
      geometry:{type:"Point", coordinates:[lon,lat]}}]});
    // ★따라가기를 한 번 하고 끝내지 않는다 — 이동 중에 계속 붙어 있어야 현장에서 쓸모가 있다.
    //   대신 사용자가 지도를 직접 끌면 그 순간 풀린다(아래 dragstart).
    if(gpsFollow) map.easeTo({center:[lon,lat], zoom:Math.max(map.getZoom(),15), duration:600});
    status(`현위치 ${lat.toFixed(5)}, ${lon.toFixed(5)} (±${Math.round(acc)}m)`);
  }, (err)=>{
    gpsStop();
    const why = err.code===1 ? "브라우저에서 위치 권한이 거부됐습니다"
              : err.code===2 ? "위치를 확인할 수 없습니다(신호 없음)"
              : "위치 확인이 시간 내에 끝나지 않았습니다";
    status("현위치 실패 — " + why, true);
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
document.getElementById("btnMemo").onclick=memoMenuToggle;
document.querySelectorAll("#memoMenu [data-mm]").forEach(b=>
  b.onclick=()=>memoPick(b.dataset.mm||null));
document.getElementById("memoSave").onclick=memoSaveEdit;
document.getElementById("memoDel").onclick=memoDelete;
document.getElementById("memoClose").onclick=memoClose;
document.getElementById("btnMemoOut").onclick=memoExport;
gpsBtns().forEach(b=>b.onclick=gpsStart);
map.on("dragstart",()=>{ if(gpsFollow){ gpsFollow=false; status("따라가기 해제 — 현위치 버튼을 다시 누르면 재개"); } });

/* ══ 시작 ═══════════════════════════════════════════════════════════════════ */
/* ★조용한 실패를 막는다. 타일·글리프가 404 나도 지도는 그냥 비어 보일 뿐이라
   "도로가 안 나온다"가 되고 원인을 못 찾는다. 소스 오류를 화면에 띄운다. */
map.on("error",(e)=>{
  const m=(e && e.error && e.error.message) || "";
  const src=(e && e.sourceId) ? ` [${e.sourceId}]` : "";
  if(!m) return;
  console.warn("[지도 오류]"+src, e.error);
  if(/404|Failed to fetch|NetworkError|AJAXError/i.test(m))
    status(`자료를 못 불러왔습니다${src} — ${m.slice(0,90)}`, true);
});
map.on("mousemove",(e)=>{
  document.getElementById("coord").textContent =
    `${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}  ·  z${map.getZoom().toFixed(1)}`;
});
map.on("zoomend",()=>{
  if(roadOn && map.getZoom() < ROAD_MINZ)
    status(`🔍 도로는 z${ROAD_MINZ} 이상에서 보입니다 (지금 z${map.getZoom().toFixed(1)})`);
});
map.once("load", async ()=>{
  setBasemap(curBm);
  try{                                   // minzoom 은 서버가 알려 준다(사본을 고정하지 않는다)
    const t=await fetchJson("/tiles/layers");
    const r=(t.layers||[]).find(l=>l.layer==="road_line");
    if(r && r.minzoom) ROAD_MINZ=r.minzoom;
  }catch(e){ /* 못 받으면 기본값 12 */ }
  const aoiBounds = await aoiLoad();
  await riLoad(aoiBounds);
  roadStep = 1; roadApply();             // 도로는 켠 채로 시작(기본 70% — 30% 투명)
  memoLayers(); memoRender(); rectBind(); // 저장해 둔 메모를 바로 띄운다
});
</script>
